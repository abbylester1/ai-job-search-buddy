<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Job Search Buddy</title>
<script>
  // Set before first paint to avoid a flash of the wrong theme.
  try {
    const t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch {}
</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='58' fill='%231D2048'/%3E%3Cg transform='translate(28,30)'%3E%3Cellipse cx='34' cy='40' rx='30' ry='22' fill='%23E8A33D'/%3E%3Cpath d='M58 32 L84 20 L78 42 Z' fill='%23E8A33D'/%3E%3Ccircle cx='16' cy='24' r='18' fill='%23E8A33D'/%3E%3Cpath d='M2 12 L10 -8 L20 12 Z' fill='%23E8A33D'/%3E%3Cpath d='M16 12 L26 -6 L30 14 Z' fill='%23E8A33D'/%3E%3Cpath d='M0 24 Q12 32 20 24 Q16 38 6 36 Q0 32 0 24 Z' fill='%23F1EFFA'/%3E%3Ccircle cx='9' cy='22' r='2.2' fill='%231D2048'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* Reference: Linear (linear.app) — left-rail nav, single content pane,
     elevated cards over a flat background, one accent on the real primary
     action only, colored pills for status instead of plain text. */
  :root{
    --bg:#0b0d1f; --panel:#0d0f24; --card:#14162e; --field:#191c3b; --line:#272b52;
    --text:#f1effa; --muted:#8d8ab8; --faint:#5a5a86;
    --accent:#e8a33d; --accent-ink:#2a1900; --accent2:#a99bf0;
    --danger:#e2574c; --success:#2e9e63;
  }
  /* Default follows the OS preference; an explicit data-theme attribute
     (set by the toggle, persisted in localStorage) always wins. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f6f5fb; --panel:#ffffff; --card:#ffffff; --field:#f1f0f9; --line:#e2e0f0;
      --text:#1d2048; --muted:#67638c; --faint:#9a97b8;
      --accent:#d98a1f; --accent-ink:#ffffff; --accent2:#6d4fd1;
      --danger:#c23b31; --success:#1f7a4d;
    }
  }
  :root[data-theme="light"]{
    --bg:#f6f5fb; --panel:#ffffff; --card:#ffffff; --field:#f1f0f9; --line:#e2e0f0;
    --text:#1d2048; --muted:#67638c; --faint:#9a97b8;
    --accent:#d98a1f; --accent-ink:#ffffff; --accent2:#6d4fd1;
    --danger:#c23b31; --success:#1f7a4d;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .shell{display:flex;min-height:100vh}

  .rail{width:232px;flex:none;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
  .brand svg{flex:none}
  .brand span{font-weight:800;font-size:15px;letter-spacing:-.01em}
  nav.tabs{display:flex;flex-direction:column;gap:2px}
  nav.tabs button{justify-content:flex-start;gap:10px;background:transparent;border:1px solid transparent;
        color:var(--muted);font-weight:600;padding:9px 10px;border-radius:7px}
  nav.tabs button svg{flex:none;opacity:.8}
  nav.tabs button.active{background:var(--card);color:var(--text);border-color:var(--line)}
  nav.tabs button:hover:not(.active){background:rgba(255,255,255,.03);color:var(--text)}
  .rail-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  #credits{font-size:12px;color:var(--accent2);font-weight:700;letter-spacing:.02em}

  main{flex:1;min-width:0;padding:36px 44px;max-width:860px}
  .view{display:none}
  .view.active{display:block}
  .view-head{margin-bottom:22px}
  .view-head h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.01em}
  .view-head p{margin:0;color:var(--muted);font-size:13.5px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px;
        box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -16px rgba(0,0,0,.5)}
  .card>h3{margin:0 0 16px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

  input,textarea,select{font:inherit;border-radius:7px;border:1px solid var(--line);background:var(--field);color:var(--text);padding:10px 11px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  textarea{width:100%;resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}

  button{font:inherit;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;padding:10px 16px;
        cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;transition:border-color .12s,background .12s}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button:hover:not(:disabled):not(.primary){border-color:var(--faint)}
  button.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.sm{padding:6px 11px;font-size:13px}

  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .row>div{flex:1;min-width:160px}

  .app-list{display:flex;flex-direction:column;gap:10px}
  .app-row{display:flex;align-items:center;gap:14px;background:var(--field);border:1px solid var(--line);
        border-radius:10px;padding:14px 16px;border-left:3px solid var(--line)}
  .app-row[data-status="interview"]{border-left-color:var(--accent)}
  .app-row[data-status="offer"]{border-left-color:var(--success)}
  .app-row[data-status="rejected"],.app-row[data-status="withdrawn"]{border-left-color:var(--faint);opacity:.75}
  .app-avatar{width:36px;height:36px;border-radius:9px;background:var(--line);display:flex;align-items:center;justify-content:center;
        font-weight:800;font-size:13px;color:var(--text);flex:none}
  .app-main{flex:1;min-width:0}
  .app-main .company{font-weight:700;font-size:14.5px}
  .app-main .role{color:var(--muted);font-size:13px}
  .fit{font-size:12.5px;color:var(--muted);width:52px;text-align:center;flex:none}
  .fit b{color:var(--text)}
  select.statusSel{font-size:12.5px;padding:6px 8px;min-width:112px;flex:none}
  .app-actions{display:flex;gap:6px;flex:none}

  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--field);color:var(--accent2)}
  .muted{color:var(--muted)}
  .hidden{display:none !important}
  .empty{color:var(--faint);font-size:13.5px;padding:18px 0;text-align:center}
  pre{white-space:pre-wrap;background:var(--field);padding:14px;border-radius:8px;border:1px solid var(--line);font-size:13px}
  .err{color:var(--danger);font-size:13px;margin-top:8px}

  #detail{position:fixed;inset:0;background:rgba(5,6,16,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  #detail .box{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;max-height:85vh;overflow:auto;padding:24px}
  #detail .box h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:18px 0 6px}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" id="railAuthed"></aside>
  <main>
    <div id="auth" class="card hidden" style="max-width:360px;margin-top:10vh">
      <h3 style="margin-top:0">Sign in</h3>
      <div class="row"><div><label>Email</label><input id="email" type="email"></div></div>
      <div class="row" style="margin-top:10px"><div><label>Password</label><input id="password" type="password"></div></div>
      <div class="row" style="margin-top:14px">
        <button id="loginBtn" class="primary">Log in</button>
        <button id="signupBtn">Sign up</button>
      </div>
      <div id="authErr" class="err"></div>
    </div>

    <div id="app" class="hidden">
      <section id="view-profile" class="view">
        <div class="view-head"><h2>Profile</h2><p>Your CV / background — used for every evaluation and tailored letter.</p></div>
        <div class="card">
          <textarea id="profile" rows="10" placeholder="Paste your CV / background here..."></textarea>
          <div class="row" style="margin-top:12px">
            <button id="saveProfile" class="primary">Save profile</button>
            <span id="profileSaved" class="muted"></span>
          </div>
        </div>
      </section>

      <section id="view-add" class="view">
        <div class="view-head"><h2>Add application</h2><p>Paste a job posting to start tracking it.</p></div>
        <div class="card">
          <div class="row">
            <div><label>Company</label><input id="newCompany"></div>
            <div><label>Role</label><input id="newRole"></div>
          </div>
          <label style="margin-top:12px">Job posting text</label>
          <textarea id="newPosting" rows="6"></textarea>
          <div class="row" style="margin-top:12px"><button id="addApp" class="primary">Add application</button></div>
          <div id="addErr" class="err"></div>
        </div>
      </section>

      <section id="view-apps" class="view active">
        <div class="view-head"><h2>Applications</h2><p>Everything you're tracking, newest first.</p></div>
        <div class="card">
          <div id="appsList" class="app-list"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div id="detail" class="hidden"><div class="box">
  <div class="row" style="justify-content:space-between"><h3 id="detailTitle" style="margin:0;text-transform:none;font-size:17px;letter-spacing:0;color:var(--text)"></h3><button class="sm" id="closeDetail">Close</button></div>
  <div id="detailBody"></div>
</div></div>

<script>
const $ = (s) => document.querySelector(s);
let CFG = null;

const RAIL_ICON = `<svg width="26" height="26" viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="#1D2048"/><g transform="translate(28,30)"><ellipse cx="34" cy="40" rx="30" ry="22" fill="#E8A33D"/><path d="M58 32 L84 20 L78 42 Z" fill="#E8A33D"/><circle cx="16" cy="24" r="18" fill="#E8A33D"/><path d="M2 12 L10 -8 L20 12 Z" fill="#E8A33D"/><path d="M16 12 L26 -6 L30 14 Z" fill="#E8A33D"/><path d="M0 24 Q12 32 20 24 Q16 38 6 36 Q0 32 0 24 Z" fill="#F1EFFA"/><circle cx="9" cy="22" r="2.2" fill="#1D2048"/></g></svg>`;
const ICONS = {
  profile: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>',
  add: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  list: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
};

function esc(s) { return (s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function initials(name) {
  return (name || "?").trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() || "").join("") || "?";
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function boot() {
  CFG = await api("/api/config");
  buildRail();
  if (CFG.mode === "local") {
    $("#auth").classList.add("hidden");
    await showApp();
  } else {
    try { await refreshMe(); await showApp(); }
    catch { $("#auth").classList.remove("hidden"); }
  }
  wireAuth();
  wireApp();
}

function buildRail() {
  $("#railAuthed").innerHTML = `
    <div class="brand">${RAIL_ICON}<span>Job Search Buddy</span></div>
    <nav class="tabs">
      <button data-view="apps" class="active">${ICONS.list} Applications</button>
      <button data-view="add">${ICONS.add} Add application</button>
      <button data-view="profile">${ICONS.profile} Profile</button>
    </nav>
    <div class="rail-footer">
      <button class="sm" id="themeToggle" style="align-self:flex-start"></button>
      <div id="who"></div>
    </div>`;
  $("#railAuthed").querySelectorAll("[data-view]").forEach(b =>
    b.addEventListener("click", () => switchView(b.dataset.view)));
  $("#themeToggle").addEventListener("click", toggleTheme);
  updateThemeToggleLabel();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const next = current === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  updateThemeToggleLabel();
}

function updateThemeToggleLabel() {
  const current = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  $("#themeToggle").textContent = current === "light" ? "🌙 Dark mode" : "☀️ Light mode";
}

function switchView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === `view-${name}`));
  document.querySelectorAll("nav.tabs [data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === name));
}

async function refreshMe() {
  const me = await api("/api/me");
  $("#profile").value = me.profile || "";
  renderWho(me);
  return me;
}

function renderWho(me) {
  const who = $("#who");
  if (CFG.mode === "local") { who.innerHTML = ""; return; }
  who.innerHTML = `
    <span id="credits">${me.credits} credits</span>
    ${CFG.billing_enabled ? Object.entries(CFG.packs).map(([id,p]) =>
        `<button class="primary sm" data-pack="${id}">Buy ${p.label}</button>`).join("") : ""}
    <button class="sm" id="logoutBtn">Log out</button>`;
  who.querySelectorAll("[data-pack]").forEach(b => b.addEventListener("click", () => buy(b.dataset.pack)));
  const lo = $("#logoutBtn"); if (lo) lo.addEventListener("click", async () => { await api("/api/logout", {method:"POST"}); location.reload(); });
}

async function buy(pack) {
  try { const { url } = await api("/api/billing/checkout", { method: "POST", body: { pack } }); location.href = url; }
  catch (e) { alert(e.message); }
}

function wireAuth() {
  $("#loginBtn").onclick = async () => {
    try { await api("/api/login", {method:"POST", body:{email:$("#email").value, password:$("#password").value}}); location.reload(); }
    catch (e) { $("#authErr").textContent = e.message; }
  };
  $("#signupBtn").onclick = async () => {
    try { await api("/api/signup", {method:"POST", body:{email:$("#email").value, password:$("#password").value}}); location.reload(); }
    catch (e) { $("#authErr").textContent = e.message; }
  };
}

async function showApp() {
  $("#app").classList.remove("hidden");
  await loadApps();
}

function wireApp() {
  $("#saveProfile").onclick = async () => {
    await api("/api/profile", {method:"PUT", body:{profile: $("#profile").value}});
    $("#profileSaved").textContent = "Saved.";
    setTimeout(() => $("#profileSaved").textContent = "", 2000);
  };
  $("#addApp").onclick = async () => {
    $("#addErr").textContent = "";
    try {
      await api("/api/applications", {method:"POST", body:{
        company: $("#newCompany").value, role: $("#newRole").value, posting: $("#newPosting").value,
      }});
      $("#newCompany").value = $("#newRole").value = $("#newPosting").value = "";
      await loadApps();
      switchView("apps");
    } catch (e) { $("#addErr").textContent = e.message; }
  };
  $("#closeDetail").onclick = () => $("#detail").classList.add("hidden");
}

async function loadApps() {
  const apps = await api("/api/applications");
  const list = $("#appsList");
  if (!apps.length) {
    list.innerHTML = `<div class="empty">No applications yet — add one to get started.</div>`;
    return;
  }
  list.innerHTML = apps.map(a => `
    <div class="app-row" data-status="${a.status}">
      <div class="app-avatar">${esc(initials(a.company))}</div>
      <div class="app-main">
        <div class="company">${esc(a.company)}</div>
        <div class="role">${esc(a.role)}</div>
      </div>
      <div class="fit">${a.fit_score != null ? `<b>${a.fit_score}</b>%` : "—"}</div>
      <select data-id="${a.id}" class="statusSel">
        ${CFG.statuses.map(s => `<option value="${s}" ${s===a.status?"selected":""}>${s}</option>`).join("")}
      </select>
      <div class="app-actions">
        <button class="sm" data-open="${a.id}">Open</button>
        <button class="sm danger" data-del="${a.id}">Delete</button>
      </div>
    </div>`).join("");

  list.querySelectorAll(".statusSel").forEach(sel =>
    sel.addEventListener("change", async () => {
      await api(`/api/applications/${sel.dataset.id}`, {method:"PATCH", body:{status: sel.value}});
      sel.closest(".app-row").dataset.status = sel.value;
    }));
  list.querySelectorAll("[data-del]").forEach(b =>
    b.addEventListener("click", async () => {
      if (!confirm("Delete this application?")) return;
      await api(`/api/applications/${b.dataset.del}`, {method:"DELETE"});
      await loadApps();
    }));
  list.querySelectorAll("[data-open]").forEach(b =>
    b.addEventListener("click", () => openDetail(apps.find(a => a.id == b.dataset.open))));
}

function openDetail(a) {
  $("#detailTitle").textContent = `${a.company} — ${a.role}`;
  $("#detailBody").innerHTML = `
    <div class="row" style="margin:10px 0 0">
      <button id="evalBtn">Evaluate fit${CFG.mode!=="local" ? ` (${CFG.costs.evaluate} credit)` : ""}</button>
      <button id="applyBtn" class="primary">Tailor CV + cover letter${CFG.mode!=="local" ? ` (${CFG.costs.apply} credits)` : ""}</button>
    </div>
    <div id="aiErr" class="err"></div>
    ${a.evaluation ? `<h4>Evaluation (fit: ${a.fit_score})</h4><pre>${esc(a.evaluation)}</pre>` : ""}
    ${a.cv_bullets ? `<h4>CV bullets</h4><pre>${esc(a.cv_bullets)}</pre>` : ""}
    ${a.cover_letter ? `<h4>Cover letter</h4><pre>${esc(a.cover_letter)}</pre>` : ""}
  `;
  $("#detail").classList.remove("hidden");
  $("#evalBtn").onclick = () => runAi(a.id, "evaluate", $("#evalBtn"));
  $("#applyBtn").onclick = () => runAi(a.id, "apply", $("#applyBtn"));
}

async function runAi(id, action, btn) {
  btn.disabled = true;
  $("#aiErr").textContent = "";
  try {
    await api(`/api/applications/${id}/${action}`, {method:"POST"});
    const apps = await api("/api/applications");
    openDetail(apps.find(a => a.id == id));
    if (CFG.mode !== "local") refreshMe();
    loadApps();
  } catch (e) {
    $("#aiErr").textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

boot();
</script>
</body>
</html>
