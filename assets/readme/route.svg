<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d">
<title id="t">The AI Job Search Buddy workflow</title>
<desc id="d">The workflow in order: /setup builds your profile, /scrape finds new postings, /rank shortlists the fits, /apply tailors a CV and cover letter, /interview preps every round, /outcome tracks each result.</desc>
<defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14162E"/><stop offset="1" stop-color="#1D2048"/></linearGradient></defs>
<rect width="1280" height="300" fill="url(#bg3)"/>
<line x1="80" y1="130" x2="1200" y2="130" stroke="#454B82" stroke-width="2" stroke-dasharray="2 10"/>
<circle cx="80.0" cy="130" r="14" fill="#8C7AE6" stroke="#E8A33D" stroke-width="2"/>
<text x="80.0" y="178" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="18" fill="#F1EFFA">/setup</text>
<text x="80.0" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">Build your</text>
<text x="80.0" y="220" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">profile</text>
<circle cx="304.0" cy="130" r="14" fill="#2E335C" stroke="#454B82" stroke-width="2"/>
<text x="304.0" y="178" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="18" fill="#F1EFFA">/scrape</text>
<text x="304.0" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">Find new</text>
<text x="304.0" y="220" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">postings</text>
<circle cx="528.0" cy="130" r="14" fill="#2E335C" stroke="#454B82" stroke-width="2"/>
<text x="528.0" y="178" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="18" fill="#F1EFFA">/rank</text>
<text x="528.0" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">Shortlist the</text>
<text x="528.0" y="220" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">fits</text>
<circle cx="752.0" cy="130" r="14" fill="#2E335C" stroke="#454B82" stroke-width="2"/>
<text x="752.0" y="178" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="18" fill="#F1EFFA">/apply</text>
<text x="752.0" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">Tailor CV</text>
<text x="752.0" y="220" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">+ letter</text>
<circle cx="976.0" cy="130" r="14" fill="#2E335C" stroke="#454B82" stroke-width="2"/>
<text x="976.0" y="178" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="18" fill="#F1EFFA">/interview</text>
<text x="976.0" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">Prep every</text>
<text x="976.0" y="220" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">round</text>
<circle cx="1200.0" cy="130" r="14" fill="#E8A33D" stroke="#E8A33D" stroke-width="2"/>
<text x="1200.0" y="178" text-anchor="middle" font-family="SF Mono,Menlo,monospace" font-size="18" fill="#F1EFFA">/outcome</text>
<text x="1200.0" y="202" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">Track each</text>
<text x="1200.0" y="220" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8D8AB8">result</text>
<text x="640.0" y="48" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-weight="800" font-size="26" fill="#F1EFFA">One command per stage of the search</text>
</svg>