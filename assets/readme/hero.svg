<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">AI Job Search Buddy</title>
  <desc id="d">Scout the courier fox carries an application along a flight path to a destination pin. The job search that runs on your machine.</desc>
  <style>
    .flow{animation:flow 1.6s linear infinite}
    .scout{offset-path:path("M 700 400 C 820 416, 860 270, 960 258 S 1040 184, 1070 168");offset-rotate:0deg;animation:fly 9s cubic-bezier(.45,.05,.4,1) infinite}
    .bob{animation:bob 1.1s ease-in-out infinite alternate}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 9s ease-out infinite}
    .ring2{animation-delay:.35s}
    .pin{transform-box:fill-box;transform-origin:50% 100%;animation:land 9s ease-out infinite}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    @keyframes fly{0%{offset-distance:0%;opacity:0}6%{opacity:1}70%{offset-distance:100%;opacity:1}78%,100%{offset-distance:100%;opacity:0}}
    @keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
    @keyframes ring{0%,68%{transform:scale(.2);opacity:0}72%{opacity:.8}96%,100%{transform:scale(2.6);opacity:0}}
    @keyframes land{0%,68%{transform:scale(1)}72%{transform:scale(1.22)}78%,100%{transform:scale(1)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.scout{offset-distance:62%}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14162E"/><stop offset="1" stop-color="#1D2048"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.35"/><stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#glow)"/>
  <g stroke="#454B82" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="1070" cy="128" r="60"/><circle cx="1070" cy="128" r="100"/><circle cx="1070" cy="128" r="140"/>
  </g>

  <text x="92" y="160" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-weight="800" font-size="68" fill="#F1EFFA">AI Job Search</text>
  <text x="92" y="228" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-weight="800" font-size="68" fill="#E8A33D">Buddy</text>
  <text x="92" y="270" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="24" fill="#8D8AB8">The job search that runs on your machine.</text>

  <g transform="translate(92,300)">
    <rect width="440" height="56" rx="12" fill="#0B0D1F" stroke="#2E335C"/>
    <text x="24" y="36" font-family="SF Mono,Menlo,monospace" font-size="22" fill="#E8A33D">&gt;</text>
    <text x="48" y="36" font-family="SF Mono,Menlo,monospace" font-size="22" fill="#F1EFFA">/setup<tspan class="caret" fill="#E8A33D">|</tspan></text>
  </g>
  <text x="92" y="404" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" fill="#8D8AB8">Built on Claude Code. Your profile, your files, your machine.</text>

  <path d="M 700 400 C 820 416, 860 270, 960 258 S 1040 184, 1070 168" fill="none" stroke="#454B82" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" class="flow"/>

  <g transform="translate(636,372)">
    <rect x="0" y="0" width="56" height="40" rx="4" fill="#F1EFFA"/>
    <path d="M0 0 L28 24 L56 0" fill="none" stroke="#1D2048" stroke-width="2"/>
  </g>

  <g class="scout">
    <g class="bob" transform="translate(-26,-22)">
      <ellipse cx="26" cy="30" rx="22" ry="16" fill="#E8A33D"/>
      <path d="M44 24 L62 16 L58 30 Z" fill="#E8A33D"/>
      <circle cx="12" cy="18" r="13" fill="#E8A33D"/>
      <path d="M2 10 L8 -4 L14 10 Z" fill="#E8A33D"/>
      <path d="M12 10 L18 -2 L22 11 Z" fill="#E8A33D"/>
      <path d="M1 18 Q9 24 15 18 Q11 28 5 27 Q1 24 1 18 Z" fill="#F1EFFA"/>
      <circle cx="7" cy="16" r="1.6" fill="#1D2048"/>
      <path d="M26 38 L34 50 L18 50 Z" fill="#F1EFFA" opacity=".9"/>
    </g>
  </g>

  <g transform="translate(1070,128)">
    <circle class="ring" r="20" fill="none" stroke="#E8A33D" stroke-width="3"/>
    <circle class="ring ring2" r="20" fill="none" stroke="#E8A33D" stroke-width="3"/>
    <g class="pin">
      <path d="M0 -36 C 18 -36 28 -22 28 -8 C 28 10 0 36 0 36 C 0 36 -28 10 -28 -8 C -28 -22 -18 -36 0 -36 Z" fill="#E8A33D"/>
      <circle cx="0" cy="-8" r="10" fill="#1D2048"/>
    </g>
  </g>
</svg>
