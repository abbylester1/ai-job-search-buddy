<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">How /apply works</title>
  <desc id="d">A job posting passes an integrity gate and fit evaluation, then loops through draft, review, revise, and compile plus inspect until the CV is exactly two pages, the cover letter one page, and the ATS text layer is checked.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14162E"/><stop offset="1" stop-color="#1D2048"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#454B82"/>
    </marker>
  </defs>
  <rect width="1280" height="360" fill="url(#bg4)"/>
  <text x="640" y="46" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-weight="800" font-size="26" fill="#F1EFFA">/apply: posting to verified application</text>

  <g font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="15">
    <g transform="translate(40,120)">
      <rect width="150" height="70" rx="10" fill="#2E335C" stroke="#454B82"/>
      <text x="75" y="32" text-anchor="middle" fill="#F1EFFA" font-weight="600">Job posting</text>
      <text x="75" y="52" text-anchor="middle" fill="#8D8AB8" font-size="12">integrity gate</text>
    </g>
    <line x1="190" y1="155" x2="238" y2="155" stroke="#454B82" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(240,120)">
      <rect width="150" height="70" rx="10" fill="#2E335C" stroke="#454B82"/>
      <text x="75" y="32" text-anchor="middle" fill="#F1EFFA" font-weight="600">Fit evaluation</text>
      <text x="75" y="52" text-anchor="middle" fill="#8D8AB8" font-size="12">skills &amp; culture match</text>
    </g>
    <line x1="390" y1="155" x2="438" y2="155" stroke="#454B82" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(440,72)">
      <rect width="400" height="166" rx="14" fill="none" stroke="#8C7AE6" stroke-width="2" stroke-dasharray="4 6"/>
      <text x="200" y="-10" text-anchor="middle" fill="#8C7AE6" font-size="13" font-weight="600">loop until both pass</text>

      <g transform="translate(20,20)">
        <rect width="150" height="56" rx="10" fill="#1D2048" stroke="#454B82"/>
        <text x="75" y="33" text-anchor="middle" fill="#F1EFFA">Draft</text>
      </g>
      <line x1="170" y1="48" x2="210" y2="48" stroke="#454B82" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(210,20)">
        <rect width="150" height="56" rx="10" fill="#1D2048" stroke="#454B82"/>
        <text x="75" y="33" text-anchor="middle" fill="#F1EFFA">Review</text>
      </g>

      <g transform="translate(20,90)">
        <rect width="150" height="56" rx="10" fill="#1D2048" stroke="#454B82"/>
        <text x="75" y="33" text-anchor="middle" fill="#F1EFFA">Revise</text>
      </g>
      <line x1="170" y1="118" x2="210" y2="118" stroke="#454B82" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(210,90)">
        <rect width="150" height="56" rx="10" fill="#1D2048" stroke="#454B82"/>
        <text x="75" y="24" text-anchor="middle" fill="#F1EFFA">Compile +</text>
        <text x="75" y="42" text-anchor="middle" fill="#F1EFFA">inspect</text>
      </g>

      <path d="M 285 76 L 285 90" stroke="#454B82" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M 95 146 C 60 170, 60 10, 95 20" stroke="#8C7AE6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    </g>

    <line x1="840" y1="155" x2="888" y2="155" stroke="#454B82" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(890,120)">
      <rect width="170" height="70" rx="10" fill="#2E335C" stroke="#E8A33D" stroke-width="2"/>
      <text x="85" y="32" text-anchor="middle" fill="#F1EFFA" font-weight="600">2-page CV +</text>
      <text x="85" y="52" text-anchor="middle" fill="#F1EFFA" font-weight="600">1-page letter</text>
    </g>
    <line x1="1060" y1="155" x2="1100" y2="155" stroke="#454B82" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(1102,120)">
      <circle cx="35" cy="35" r="35" fill="#E8A33D"/>
      <path d="M20 36 L30 46 L52 22" stroke="#1D2048" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(1080,270)" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#8D8AB8">
    <text x="0" y="0">ATS text layer checked</text>
  </g>
</svg>
